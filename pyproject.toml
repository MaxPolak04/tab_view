[project]
name = "tab-view"
version = "0.1.0"
description = "A Flask-based tablet display system for eNStudios, designed to indicate real-time client occupancy and room status for studios."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Maksymilian Polak", email = "max.polak04@gmail.com" }
]
# Main application dependencies
dependencies = [
    "alembic>=1.16.4",
    "aniso8601>=10.0.1",
    "apscheduler>=3.11.1",
    "blinker>=1.9.0",
    "cffi>=1.17.1",
    "click>=8.1.7",
    "cryptography>=46.0.5",
    "deprecated>=1.3.1",
    "dnspython>=2.7.0",
    "email-validator>=2.2.0",
    "flask>=3.1.3",
    "flask-apscheduler>=1.13.1",
    "flask-limiter>=4.0.0",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-restful>=0.3.10",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "greenlet>=3.2.4",
    "gunicorn>=23.0.0",
    "idna>=3.10",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "limits>=5.6.0",
    "mako>=1.3.10",
    "markupsafe>=3.0.2",
    "ntplib>=0.4.0",
    "ordered-set>=4.1.0",
    "pycparser>=2.22",
    "pymysql>=1.1.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "six>=1.17.0",
    "sqlalchemy>=2.0.43",
    "typing-extensions>=4.14.1",
    "tzlocal>=5.3.1",
    "werkzeug>=3.1.5",
    "wrapt>=2.0.1",
    "wtforms>=3.2.1",
    "redis>=7.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Development tools
[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Ignore unused imports in __init__.py files (standard Flask practice)
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
