name: Run Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Pytest with uv
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: test-secret-key-for-ci
      DATABASE_URL: 'sqlite:///:memory:'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync

    # 4. Uruchom testy
    - name: Run Tests
      run: uv run pytest