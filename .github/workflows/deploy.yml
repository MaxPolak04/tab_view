name: Deploy to Production

# It only runs if the tests (from the tests.yml file) pass successfully on the main branch.
on:
  workflow_run:
    workflows: ["Run Tests"]
    branches: [main]
    types: 
      - completed
  # It also allows manual activation via a button in GitHub.
  workflow_dispatch:

jobs:
  build-and-push:
    # Only runs if tests were successful (for workflow_run)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Authorization to record in GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags: latest and unique commit hash (for security)
          tags: |
            ghcr.io/${{ github.repository_owner }}/tab_view:latest
            ghcr.io/${{ github.repository_owner }}/tab_view:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Debian Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # IP Twojego serwera
          username: ${{ secrets.SERVER_USER }} # Np. root lub mpolak
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Twój klucz prywatny
          script: |
            # 1. Zaloguj się do rejestru GitHuba na serwerze
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Przejdź do katalogu aplikacji (musisz go wcześniej stworzyć!)
            cd /opt/tab_view

            # 3. Pobierz najnowszy obraz
            docker compose pull

            # 4. Przeładuj kontenery (uruchomi nowy, zatrzyma stary)
            docker compose up -d --remove-orphans

            # 5. Opcjonalnie: Uruchom migracje bazy danych
            # docker compose exec -T web uv run flask db upgrade

            # 6. Posprzątaj stare, nieużywane obrazy (żeby nie zapchać dysku)
            docker image prune -f