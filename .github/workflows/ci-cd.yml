name: CI/CD Pipeline

on:
  # Triggers full deployment cycle (Tests -> Build -> Push) when PR is merged
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  # Triggers quality gate (Tests) for any PR targeting main
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: maxpolak04/tab_view
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Run Tests & Security Checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-key
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Lint Code (Ruff)
        run: uv run ruff check .

      - name: Check Formatting (Ruff)
        run: uv run ruff format --check .

      - name: Security Scan (Bandit)
        run: uv run bandit -r tab_view/ -s B101

      - name: Dependency Audit (Pip-Audit)
        run: uv run pip-audit --ignore-vuln CVE-2026-4539

      - name: Run Pytest
        run: uv run pytest

  build-and-push:
    needs: test
    # Ensures build happens ONLY on main branch push, saving CI minutes on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
