name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: maxpolak04/tab_view
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Run Tests & Security Checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-key
      DATABASE_URL: 'sqlite:///:memory:'
      WEATHER_LATITUDE: '52.4064'
      WEATHER_LONGITUDE: '16.9252'
      OPENWEATHERMAP_API_KEY: 'dummy-test-key'
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Lint Code (Ruff)
        run: uv run ruff check .

      - name: Check Formatting (Ruff)
        run: uv run ruff format --check .

      - name: Security Scan (Bandit)
        run: uv run bandit -r tab_view/ -s B101

      - name: Dependency Audit (Pip-Audit)
        run: uv run pip-audit --local --skip-editable --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219

      - name: Run Pytest
        run: uv run pytest

  build-and-push:
    needs: test
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tab_view:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security Scan Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tab_view:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
