name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: maxpolak04/tab_view
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 1. TESTING & SECURITY & QUALITY
  test:
    name: Run Tests & Security Checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-key
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Lint Code (Ruff)
        # Checks for syntax errors and imports
        run: uv run ruff check .

      - name: Check Formatting (Ruff)
        # Checks if the code is nicely formatted
        run: uv run ruff format --check .

      - name: Security Scan (Bandit)
        # Scans code for security vulnerabilities (ignores B101 assertions)
        run: uv run bandit -r tab_view/ -s B101

      - name: Dependency Audit (Pip-Audit)
        # Checks whether libraries have any known viruses/vulnerabilities
        # Temporarily ignoring CVE-2026-4539 in pygments as no fix is available yet.
        run: uv run pip-audit --ignore-vuln CVE-2026-4539

      - name: Run Pytest
        run: uv run pytest

  # 2. BUILDING AND PUSHING
  build-and-push:
    needs: test
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # Logging in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Logging in to GHCR
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadata (tags)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      # Build & Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
