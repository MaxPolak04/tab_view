name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: maxpolak04/tab_view
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 1. TESTING
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-key
      DATABASE_URL: 'sqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        run: uv run pytest

  # 2. BUILDING AND PUSHING
  build-and-push:
    needs: test
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logging in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Logging in to GHCR
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadata (tags)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      # Build & Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. DEPLOY
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    name: Deploy to Server
    runs-on: self-hosted
    
    steps:
      # We download the code to the runner's working directory (e.g., actions-runner/_work/...)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copy the configuration files from the working directory to the application directory
      - name: Update configuration files
        run: |
          cp docker-compose.yml /opt/tab_view/
          cp nginx.conf /opt/tab_view/

      # We run Docker directly on the machine
      - name: Deploy Application
        run: |
          cd /opt/tab_view

          export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker compose pull
          
          docker compose up -d --remove-orphans

          docker image prune -f