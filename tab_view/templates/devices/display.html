<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display {{ device.name }}</title>

    <!-- Google Fonts - Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-5.3.8-dist/css/bootstrap.min.css') }}">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #212121;
            overflow: hidden;
        }
        .display-menu {
            background-color: #212121;
        }
    </style>
</head>
<body>
    <main class="display-menu"></main>

    <!-- Load Data -->
    <script>
        window.schedule = {{ schedule|tojson }};
        window.defaultMedia = {
            filename: "{{ media.filename }}",
            media_type: "{{ media.media_type }}"
        };
    </script>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', filename='bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js') }}"></script>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/display.js') }}"></script>
</body>
</html>
