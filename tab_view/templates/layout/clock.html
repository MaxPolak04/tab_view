<div id="system-clock-overlay" class="position-fixed end-0 z-3 d-none" style="top: 15%; transform: translateY(-50%);">
    <div class="text-white text-center"
         style="padding: 3vh 2vh 3vh 3vh; background: rgba(0,0,0,0.3); backdrop-filter: blur(12px); border-radius: 4vh 0 0 4vh; border: 1px solid rgba(255,255,255,0.1); border-right: none; box-shadow: -5px 5px 15px rgba(0,0,0,0.2);">

        <div id="clock-time" class="fw-bold" style="font-size: 8vh; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.3); margin-bottom: 1vh;">
            </div>

        <div id="clock-date" class="fw-medium opacity-90"
             style="font-size: 3vh; text-shadow: 0 2px 4px rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.2); padding-top: 1.5vh; margin-top: 1vh; letter-spacing: 0.1vw;">
            </div>

    </div>
</div>
