repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace   # Removes spaces at the end of lines
    -   id: end-of-file-fixer     # Adds an empty line at the end of the file
    -   id: check-yaml            # Checks whether YAML files are valid
    -   id: check-added-large-files # Blocks the uploading of large files (e.g., movies)

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
    -   id: ruff                  # Linter
    -   id: ruff-format           # Formatter

-   repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
    -   id: bandit
        args: ["-s", "B101"] # -s B101 ignores assert_used error
