repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevents unnecessary diffs caused by invisible characters
      - id: trailing-whitespace
      # Ensures POSIX standard compliance for file endings
      - id: end-of-file-fixer
      # Fails early locally before CI catches malformed configuration
      - id: check-yaml
      # Protects the Git tree from accidental binary blobs (Git handles large files poorly)
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      # Replaces Flake8/Isort - provides ultra-fast static analysis
      - id: ruff
      # Replaces Black - enforces consistent style across the project
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      # SAST tool to catch obvious security flaws (e.g., hardcoded secrets) before they hit remote
      - id: bandit
        args: ["-s", "B101"]
