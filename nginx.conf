events {
    worker_connections 1024;
}

http {
    client_max_body_size 2G;
    sendfile on;

    # Ukrycie wersji Nginx przed skanerami podatności
    server_tokens off;

    # Przekierowanie całego ruchu HTTP na HTTPS
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Główny serwer aplikacji (HTTPS)
    server {
        listen 443 ssl;
        server_name _;

        # Paths to certificates assembled from the host (Read-Only)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Hardening TLS protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- Security Headers (Shift-Left Security) ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

        location / {
            proxy_pass http://web:8000;

            # --- Proxy Headers ---
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- Timeouts ---
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
